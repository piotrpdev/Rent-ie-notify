[package]
name = "Rent-ie-notify"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[dependencies]
base64 = "0.23.1"
nanoserde = { version = "0.2.1", default-features = false, features = [ "std", "json" ] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "http2", "rustls"] }
tl = { version = "0.7.8", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "warn"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
indexing_slicing = "deny"
float_cmp = "deny"
modulo_one = "deny"
struct_field_names = "allow"
# nanoserde-derive 0.2.1 output trips this lint on clippy 1.92 (fixed in later
# clippy releases); it cannot be silenced on the derived impls individually.
question_mark = "allow"

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
