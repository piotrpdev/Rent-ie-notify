[package]
name = "Rent-ie-notify"
version = "0.1.0"
edition = "2024"

[dependencies]
minreq = { version = "2.14.1", default-features = false, features = [ "https" ] }
nanoserde = { version = "0.2.1", default-features = false, features = [ "std", "json" ] }
scraper = { version = "0.25.0", default-features = false }

[lints.rust]
unsafe_code = "forbid"
unused_imports = "deny"
unused_variables = "deny"
unused_must_use = "deny"
dead_code = "warn"
missing_docs = "allow"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
redundant_pub_crate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
await_holding_lock = "deny"
indexing_slicing = "deny"
float_cmp = "deny"
modulo_one = "deny"
struct_field_names = "allow"
