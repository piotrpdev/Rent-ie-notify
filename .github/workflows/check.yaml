name: 'Check'

on:
  # Branch pushes only run on the default branch; other branches are checked
  # through their pull request, so PR branches aren't checked twice.
  push:
    branches: [rust-slack-rentie-daftie-propertyie]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # rust-toolchain.toml pins the same version; this installs it with the
      # clippy and rustfmt components.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: clippy, rustfmt

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@v2

      # fmt, clippy, unit tests, archive tests, and release build.
      - name: Run checks
        run: scripts/check.sh
